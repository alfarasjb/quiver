[project]
name = "quiver"
version = "0.1.0"
description = "Global project memory MCP for Claude Code"
readme = "README.md"
authors = [
    { name = "jay", email = "alfarasjb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.11",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
quiver = "quiver:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
